# BlindPre LOO 盲测配置

# ── 数据集 ──
datasets:
  - 33small
  - 35large
  - 36med

# ── 排除蛋白 ──
exclude: {}

# ── 路径 ──
paths:
  exp_res: /Volumes/CodeandDataset/ProNAB/BfactorBT/EXP_RES
  code_data: /Volumes/CodeandDataset/ProNAB/BfactorBT/code_data

preprocessing:
  scale: true

# ── 网格搜索（GroupKFold 按蛋白分组） ──
grid_search:
  enabled: true
  cv_folds: 3

# ── 模型 ──
models:
  GBDT:
    enabled: true
    n_estimators: 1000
    max_depth: 7
    min_samples_split: 5
    learning_rate: 0.002
    subsample: 0.8
    max_features: sqrt
    param_grid:
      n_estimators: [500, 1000, 1500]
      max_depth: [5, 7, 10]
      learning_rate: [0.001, 0.002, 0.005]
      subsample: [0.6, 0.8, 1.0]
  RF:
    enabled: true
    n_estimators: 1000
    max_depth: 8
    min_samples_split: 4
    min_samples_leaf: 2
    param_grid:
      n_estimators: [500, 1000, 1500]
      max_depth: [5, 8, 15]
      min_samples_leaf: [1, 2, 4]

# ── 评估 ──
evaluation:
  random_state: 42
