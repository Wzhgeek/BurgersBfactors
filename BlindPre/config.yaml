# BlindPre LOO 盲测配置（与 B-factor 保持一致）

# ── 数据集 ──
datasets:
  - 33small
  - 35large
  - 36med

# ── 排除蛋白（与 B-factor small 对齐） ──
exclude:
  33small:
    - 1OB4
    - 1OB7
    - 2OLX

# ── 路径 ──
paths:
  exp_res: /Volumes/CodeandDataset/ProNAB/BfactorBT/EXP_RES
  code_data: /Volumes/CodeandDataset/ProNAB/BfactorBT/code_data

# ── 模型 ──
models:
  GBDT:
    enabled: true
    n_estimators: 1000
    max_depth: 7
    min_samples_split: 5
    learning_rate: 0.002
    subsample: 0.8
    max_features: sqrt
  RF:
    enabled: true
    n_estimators: 1000
    max_depth: 8
    min_samples_split: 4
    min_samples_leaf: 2

# ── 评估 ──
evaluation:
  random_state: 42
