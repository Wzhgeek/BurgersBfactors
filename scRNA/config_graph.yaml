# Author: Zihan Wang
# <wangzh011031@163.com>
# scRNA 细胞图构建 + Burgers 模拟配置

# ── 数据片（与 scratch/data_aij 目录名一致，共 14 个） ──
# 演化默认跳过 evolution.exclude 中的 slice（仍可手动 --slice 指定）
slices:
  - GSE45719
  - GSE67835
  - GSE75748time
  - GSE84133mouse1
  - GSE84133human4
  - GSE75748cell
  - GSE84133mouse2
  - GSE82187
  - GSE89232
  - GSE59114
  - GSE94820
  - GSE84133human2
  - GSE84133human1
  - GSE84133human3

# ── Burgers 演化：默认不跑的 slice（分类/建图仍可用 slices 列表） ──
evolution:
  exclude:
    - GSE84133human3

# ── 路径（HPCC scratch，大文件勿放 Pcode 仓库目录） ──
paths:
  scratch_root: /mnt/gs21/scratch/jiangj33/scRNA
  input_dir: /mnt/gs21/scratch/jiangj33/scRNA/preprocessed
  output_dir: /mnt/gs21/scratch/jiangj33/scRNA/data_aij
  sim_dir: /mnt/gs21/scratch/jiangj33/scRNA/burgers_sim
  # 分类结果（partial / scan / all_score / result.json）
  classify_dir: /mnt/gs21/scratch/jiangj33/scRNA/legacy_classify
  classify_summary_dir: /mnt/gs21/scratch/jiangj33/scRNA/legacy_classify_summary
  topo_features_dir: /mnt/gs21/scratch/jiangj33/scRNA/topo_features
  topo_features_tag: scanpy_qc_hvg2000_pca30

# ── 图结构 ──
graph:
  num_levels: 10
  percentile_start: 5
  percentile_stop: 95
  aij_k: 1                    # exp(-d^k/(k*sigma^k))
  default_mode: euclidean          # QC → CPM/10k+log1p → HVG2000 → z-score → PCA30 → 欧氏
  sim_mode: euclidean
  qc:
    enabled: true
    min_genes: 200              # 过滤低质量细胞
    min_cells: 3                # 过滤低表达基因
    min_counts: null
    max_genes: null
  pca:
    preprocess: scanpy
    distance_space: pca
    use_pca: true
    n_hvg: 2000
    n_pcs: 30                   # 可改为 50
    hvg_flavor: seurat
    target_sum: 10000           # CPM/10k
    scale_before_pca: true      # HVG 矩阵按基因 z-score
  euclidean: {}
  pearson:
    enabled: false                  # 当前主流程仅 HVG 欧氏
    eta: 3                    # conn = 1 - exp(-(r/eta)^kappa)，与旧 GSE 脚本一致
    kappa: 1
    clip_negative: true       # Pearson 负相关置 0

# ── 动力学参数 ──
dynamics:
  dt: 0.001
  dx: 1.0
  nu: 0.001
  coupling_mode: graph_diffusion
  n_steps: 3000                 # 上限步数；配合 early_stop_fraction 可提前停止
  n_steps_ref_eps: 1.0            # 与 epsilon.value 一致（仅缓存校验用）
  decay_threshold: 0.1            # 提前停止阈值：u_i(t) <= 此值视为达标
  early_stop_fraction: 1.0        # 全部原子达标即停；null=关闭提前停
  max_steps: 10000
  # 按层覆盖（可选）：L01-L10 可单独设 n_steps / decay_threshold / early_stop_fraction
  # level_overrides:
  #   1:  { n_steps: 500,  decay_threshold: 0.1, early_stop_fraction: 1.0 }
  #   8:  { n_steps: 2000, decay_threshold: 0.1, early_stop_fraction: 0.99 }
  #   10: { n_steps: 5000, decay_threshold: 0.2, early_stop_fraction: 0.5 }

# ── 耦合强度（单值） ──
epsilon:
  value: 1.0

# ── 特征 ──
features:
  stats:
    enabled: true
    names: [max, min, mean, var, median, std]
  trajectory:
    enabled: true
    n_points: 3001                # 与 n_steps 上限对齐（0..3000）

# ── 并行 ──
parallel:
  n_jobs: -1                   # -1 = SLURM_CPUS_PER_TASK（本地则 cpu_count）

# ── 按 slice 覆盖动力学（可选） ──
slice_overrides: {}
  # GSE84133human1:
  #   level_overrides:           # slice 级层覆盖，优先级高于 dynamics.level_overrides
  #     L09: { n_steps: 3000, decay_threshold: 0.15, early_stop_fraction: 0.8 }
  #     L10: { n_steps: 5000, decay_threshold: 0.2,  early_stop_fraction: 0.5 }

# ── 烟雾测试 ──
smoke:
  level: 5
  eps: 1.0
